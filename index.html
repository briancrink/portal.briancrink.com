<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617" id="themeColor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="shared/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="shared/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="shared/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Portal | Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @property --portal-spin {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @property --chroma-hue {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes portalSpin {
      to { --portal-spin: 360deg; }
    }

    @keyframes portalBloomBreathe {
      0%, 100% { filter: blur(14px); opacity: 0.55; }
      50%      { filter: blur(22px); opacity: 0.85; }
    }

    @keyframes portalBloomBreatheSoft {
      0%, 100% { filter: blur(22px); opacity: 0.28; }
      50%      { filter: blur(32px); opacity: 0.48; }
    }

    @keyframes chromaHue {
      to { --chroma-hue: 360deg; }
    }

    .portal-shell {
      position: relative;
      width: 100%;
      --portal-radius: 24px;
      --portal-border: 2px;
      --rim-outset: 3px;
      --bloom-outset: 2px;
      --bloom-soft-outset: 5px;
    }

    .portal-bloom,
    .portal-bloom-soft,
    .portal-rim {
      position: absolute;
      pointer-events: none;
    }

    .portal-bloom {
      inset: calc(-1 * var(--bloom-outset));
      border-radius: calc(var(--portal-radius) + var(--bloom-outset));
      z-index: 0;
      background: conic-gradient(
        from var(--portal-spin),
        var(--bloom-a),
        var(--bloom-b),
        var(--bloom-c),
        var(--bloom-a)
      );
      animation:
        portalSpin 7s linear infinite,
        portalBloomBreathe 4.5s ease-in-out infinite;
    }

    .portal-bloom-soft {
      inset: calc(-1 * var(--bloom-soft-outset));
      border-radius: calc(var(--portal-radius) + var(--bloom-soft-outset));
      z-index: 0;
      background: conic-gradient(
        from var(--portal-spin),
        var(--bloom-a),
        var(--bloom-b),
        var(--bloom-c),
        var(--bloom-a)
      );
      animation:
        portalSpin 11s linear infinite,
        portalBloomBreatheSoft 4.5s ease-in-out infinite;
    }

    .portal-rim {
      inset: calc(-1 * var(--rim-outset));
      border-radius: calc(var(--portal-radius) + var(--rim-outset));
      z-index: 1;
      background: conic-gradient(
        from var(--portal-spin),
        var(--rim-hot) 0%,
        var(--bloom-a) 20%,
        var(--bloom-b) 40%,
        var(--bloom-c) 60%,
        var(--bloom-a) 80%,
        var(--rim-hot) 100%
      );
      animation: portalSpin 5.5s linear infinite;
      padding: var(--rim-outset);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.95;
      box-shadow:
        0 0 8px 1px color-mix(in srgb, var(--bloom-a) 80%, transparent),
        0 0 18px 2px color-mix(in srgb, var(--bloom-b) 45%, transparent);
      transition: box-shadow 0.35s ease;
    }

    .portal-shell.life-active {
      --bloom-a: #38bdf8;
      --bloom-b: #7dd3fc;
      --bloom-c: #e0f2fe;
      --rim-hot: #f0f9ff;
    }
    .portal-shell.build-active {
      --bloom-a: #22c55e;
      --bloom-b: #4ade80;
      --bloom-c: #bbf7d0;
      --rim-hot: #f0fdf4;
    }
    .portal-shell.work-active {
      --bloom-a: #94a3b8;
      --bloom-b: #e2e8f0;
      --bloom-c: #64748b;
      --rim-hot: #f8fafc;
    }
    .portal-shell.commerce-active {
      --bloom-a: #f97316;
      --bloom-b: #fb923c;
      --bloom-c: #fdba74;
      --rim-hot: #fff7ed;
    }

    .portal-shell.chroma .portal-bloom {
      background: conic-gradient(
        from var(--portal-spin),
        #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #ff006e
      );
    }
    .portal-shell.chroma .portal-bloom-soft {
      background: conic-gradient(
        from var(--portal-spin),
        #ff4d6d, #c77dff, #4cc9f0, #80ed99, #ffd60a, #ff4d6d
      );
    }
    .portal-shell.chroma .portal-rim {
      background: conic-gradient(
        from var(--portal-spin),
        #fff, #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #fff
      );
      box-shadow:
        0 0 10px 1px rgba(255, 255, 255, 0.7),
        0 0 22px 3px rgba(131, 56, 236, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      .portal-bloom,
      .portal-bloom-soft,
      .portal-rim {
        animation: none;
      }
      .portal-bloom { filter: blur(16px); opacity: 0.65; }
      .portal-bloom-soft { filter: blur(26px); opacity: 0.35; }
    }

    html {
      height: 100%;
      background: #000000;
      transition: background 0.55s ease;
    }

    html:has(body.portal-life)     { background: #020617; }
    html:has(body.portal-build)    { background: #03140a; }
    html:has(body.portal-work)     { background: #000000; }
    html:has(body.portal-commerce) { background: #321200; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px 28px;
      overflow-x: hidden;
      overflow-y: auto;
      background: transparent;
      transition: background 0.55s ease;
      --ground-hot: #7dd3fc;
      --ground-soft: #38bdf8;
      --ground-core: #e0f2fe;
    }

    body.portal-life {
      --ground-hot: #7dd3fc;
      --ground-soft: #38bdf8;
      --ground-core: #e0f2fe;
    }
    body.portal-build {
      --ground-hot: #4ade80;
      --ground-soft: #22c55e;
      --ground-core: #bbf7d0;
    }
    body.portal-work {
      --ground-hot: #5a6677;
      --ground-soft: #303d4f;
      --ground-core: #94a3b8;
    }
    body.portal-commerce {
      --ground-hot: #fb923c;
      --ground-soft: #f97316;
      --ground-core: #ffedd5;
    }

    body:has(.portal-shell.chroma) {
      --ground-hot: #ff6b9d;
      --ground-soft: #9b6dff;
      --ground-core: #5aa9ff;
    }

    body:has(.portal-shell.chroma) .scene-ground-wash {
      background: linear-gradient(
        to bottom,
        transparent 0%,
        color-mix(in srgb, #ff6b9d 11%, transparent) 32%,
        color-mix(in srgb, #9b6dff 9%, transparent) 58%,
        color-mix(in srgb, #5aa9ff 7%, transparent) 100%
      );
      opacity: 0.88;
      filter: saturate(1.08) hue-rotate(var(--chroma-hue));
      animation: chromaHue 11s linear infinite;
    }

    body:has(.portal-shell.chroma) .scene-ground-reflect {
      background: radial-gradient(
        ellipse 48% 60% at 50% 100%,
        rgba(255, 107, 157, 0.32) 0%,
        rgba(155, 109, 255, 0.18) 30%,
        rgba(90, 169, 255, 0.12) 52%,
        transparent 78%
      );
      filter: blur(26px) saturate(1.12) hue-rotate(var(--chroma-hue));
      opacity: 0.78;
      animation: chromaHue 11s linear infinite;
    }

    body:has(.portal-shell.chroma) .scene-ground-line {
      background: radial-gradient(
        ellipse 60% 90% at 50% 50%,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 107, 157, 0.14) 28%,
        rgba(155, 109, 255, 0.10) 55%,
        transparent 85%
      );
      filter: blur(14px) saturate(1.08) hue-rotate(var(--chroma-hue));
      opacity: 0.65;
      animation: chromaHue 11s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      body:has(.portal-shell.chroma) .scene-ground-wash,
      body:has(.portal-shell.chroma) .scene-ground-reflect,
      body:has(.portal-shell.chroma) .scene-ground-line {
        animation: none;
      }
    }

    .ambient {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      z-index: 0;
      pointer-events: none;
      transition: background 0.55s ease;
    }

    body.portal-life .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(14, 164, 233, 0.811), transparent 70%),
        #020617;
    }
    body.portal-build .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(22, 163, 74, 0.811), transparent 70%),
        #03140a;
    }
    body.portal-work .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(17, 17, 17, 0.811), transparent 70%),
        #000000;
    }
    body.portal-commerce .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(255, 89, 0, 0.811), transparent 70%),
        #321200;
    }

    @media (max-width: 768px) {
      body.portal-life .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(14, 164, 233, 0.85) 0%,
            rgba(14, 164, 233, 0.3) 50%,
            #020617 100%
          ),
          #020617;
      }
      body.portal-build .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(22, 163, 74, 0.85) 0%,
            rgba(22, 163, 74, 0.3) 50%,
            #03140a 100%
          ),
          #03140a;
      }
      body.portal-work .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(60, 60, 60, 0.9) 0%,
            rgba(25, 25, 25, 0.5) 50%,
            #000000 100%
          ),
          #000000;
      }
      body.portal-commerce .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(255, 89, 0, 0.85) 0%,
            rgba(255, 89, 0, 0.3) 50%,
            #321200 100%
          ),
          #321200;
      }
    }

    .scene-ground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(28vh, 240px);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
    }

    .scene-ground-plane {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.06) 30%,
        rgba(0, 0, 0, 0.28) 65%,
        rgba(0, 0, 0, 0.5) 100%
      );
    }

    .scene-ground-wash {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--ground-soft) 0%, transparent) 0%,
        color-mix(in srgb, var(--ground-soft) 14%, transparent) 45%,
        color-mix(in srgb, var(--ground-soft) 8%, transparent) 100%
      );
      opacity: 0.85;
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .scene-ground-reflect {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 120%;
      height: 70%;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse 42% 55% at 50% 100%,
        color-mix(in srgb, var(--ground-hot) 55%, transparent) 0%,
        color-mix(in srgb, var(--ground-soft) 22%, transparent) 40%,
        transparent 72%
      );
      filter: blur(28px);
      opacity: 0.75;
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .scene-ground-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22%;
      height: 48px;
      background: radial-gradient(
        ellipse 55% 80% at 50% 50%,
        color-mix(in srgb, var(--ground-core) 35%, transparent) 0%,
        color-mix(in srgb, var(--ground-hot) 18%, transparent) 40%,
        transparent 75%
      );
      filter: blur(16px);
      opacity: 0.55;
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .header,
    .portal-stage,
    .nav-dots {
      position: relative;
      z-index: 1;
    }

    .header {
      padding: 130px 20px 0px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .header {
        padding-top: 80px;
      }
    }

    @media (min-width: 769px) {
      .portal-stage {
        max-width: 440px;
      }
      .portal {
        min-height: 560px;
      }
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover {
      opacity: 0.85;
    }

    .sub-header {
      color: #c3c3c3;
      font-size: 1rem;
      margin: 0;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .sub-header-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sub-header-link:hover {
      opacity: 0.85;
    }

    .portal-stage {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      z-index: 1;
      touch-action: pan-y;
      padding-top: 20px;
      padding-bottom: 24px;
    }

    .portal {
      width: 100%;
      border-radius: var(--portal-radius);
      position: relative;
      z-index: 2;
      overflow: hidden;
      min-height: 520px;
      border: var(--portal-border) solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
      transition: border-color 0.45s ease, filter 0.45s ease;
    }

    .portal.life-active {
      border-color: transparent;
      filter: drop-shadow(0 0 4px rgba(14, 165, 233, 0.3))
              drop-shadow(0 0 8px rgba(14, 165, 233, 0.14));
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(
          to bottom,
          #fde047 0%,
          #facc15 3%,
          #68d2ff 7%,
          #38bdf8 18%,
          #38bdf8 40%,
          #38bdf8 60%,
          #38bdf8 82%,
          #4ade80 94%,
          #22c55e 97%,
          #16a34a 100%
        ) border-box;
      background-clip: padding-box, border-box;
      background-origin: border-box;
    }

    .portal.build-active {
      border-color: rgba(134, 239, 172, 0.45);
      filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.28))
              drop-shadow(0 0 8px rgba(34, 197, 94, 0.12));
    }

    .portal.work-active {
      border-color: rgba(255, 255, 255, 0.12);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12))
              drop-shadow(0 0 8px rgba(255, 255, 255, 0.06));
    }

    .portal.commerce-active {
      border-color: rgba(253, 186, 116, 0.5);
      filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.28))
              drop-shadow(0 0 8px rgba(249, 115, 22, 0.12));
    }


    .world {
      position: absolute;
      inset: 0;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: none;
      transition: opacity 0.45s ease;
      overflow: hidden;
      border-radius: 0px;
      z-index: 1;
    }

    .world.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* keep classes harmless if JS still toggles them */
    .world.exit-left,
    .world.exit-right {
      opacity: 0;
      transform: none;
    } 

    .world.life {
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .world.life.active {
      border: none;
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .life-sun {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      left: 0;
      top: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 35% 35%, #fff7ae 0%, #fde047 35%, #f59e0b 72%, #d97706 100%);
      box-shadow:
        0 0 18px rgba(250, 204, 21, 0.75),
        0 0 36px rgba(245, 158, 11, 0.45);
      will-change: transform, opacity;
      transform: translate(-30px, 78%) scale(0.7);
    }

    .life-sun::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.35), transparent 70%);
    }

    .life-grass {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -2px;
      height: 64px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: var(--w, 6px);
      height: var(--h, 40px);
      border-radius: 80% 80% 20% 20% / 100% 100% 10% 10%;
      transform-origin: bottom center;
      transform: scaleY(0) rotate(var(--tilt, 0deg)) skewX(var(--skew, 0deg));
      opacity: 0;
      will-change: transform, opacity;
      background: linear-gradient(to top, var(--c1) 0%, var(--c2) 42%, var(--c3) 78%, var(--c4, var(--c3)) 100%);
      filter: saturate(1.08) contrast(1.05);
    }

    .blade.b1  { left: 1%;  --h:28px; --w:5px; --tilt:-10deg; --skew:4deg;  --c1:#14532d; --c2:#166534; --c3:#15803d; --c4:#4ade80; }
    .blade.b2  { left: 5%;  --h:36px; --w:6px; --tilt:8deg;   --skew:-3deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#86efac; }
    .blade.b3  { left: 9%;  --h:30px; --w:5px; --tilt:-6deg;  --skew:2deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#bbf7d0; }
    .blade.b4  { left: 13%; --h:40px; --w:7px; --tilt:11deg;  --skew:-4deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#4ade80; }
    .blade.b5  { left: 17%; --h:26px; --w:5px; --tilt:-9deg;  --skew:3deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#86efac; }
    .blade.b6  { left: 21%; --h:38px; --w:6px; --tilt:5deg;   --skew:-2deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#bbf7d0; }
    .blade.b7  { left: 25%; --h:32px; --w:5px; --tilt:-12deg; --skew:5deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#4ade80; }
    .blade.b8  { left: 29%; --h:42px; --w:7px; --tilt:7deg;   --skew:-3deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#86efac; }
    .blade.b9  { left: 33%; --h:27px; --w:5px; --tilt:-4deg;  --skew:2deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#bbf7d0; }
    .blade.b10 { left: 37%; --h:39px; --w:6px; --tilt:10deg;  --skew:-5deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#4ade80; }
    .blade.b11 { left: 41%; --h:31px; --w:5px; --tilt:-8deg;  --skew:3deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#86efac; }
    .blade.b12 { left: 45%; --h:44px; --w:7px; --tilt:6deg;   --skew:-2deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#bbf7d0; }

    .life-ground {

      pointer-events: none;
      z-index: 0;

  <script>
    const body = document.body;
    const portal = document.getElementById('portal');
    const portalShell = document.getElementById('portalShell');
    const stage = document.getElementById('stage');
    const dots = [...document.querySelectorAll('.nav-dot')];
    const lifeSun = document.getElementById('lifeSun');
    const lifeWorld = document.querySelector('.world.life');
    const buildWorld = document.getElementById('buildWorld');
    const blades = [...document.querySelectorAll('.blade')];
    const buildIcons = [...document.querySelectorAll('.build-icon')];

    /* ============================================================
       PORTAL ORDER — change only this array to reorder OS views.
       Keys: 'life' (LifeOS), 'build' (DevOS), 'work' (CareerOS),
             'commerce' (BossOS)
       Example BossOS first:
         const PORTAL_ORDER = ['commerce', 'life', 'build', 'work'];
       ============================================================ */
    const PORTAL_ORDER = ['life', 'commerce', 'build', 'work'];

    const worldByName = Object.fromEntries(
      [...document.querySelectorAll('.world')].map((w) => [w.dataset.portal, w])
    );
    // Ordered list driven only by PORTAL_ORDER (not HTML section order)
    const worlds = PORTAL_ORDER.map((name) => {
      const w = worldByName[name];
      if (!w) console.warn('[portal] missing world for', name);
      return w;
    }).filter(Boolean);
    const PORTALS = worlds.map((w) => w.dataset.portal);

    // Sync data-index, category labels, and active class to PORTAL_ORDER
    worlds.forEach((w, i) => {
      w.dataset.index = String(i);
      const cat = w.querySelector('.category');
      if (cat) cat.textContent = String(i + 1).padStart(2, '0');
      w.classList.toggle('active', i === 0);
      w.classList.remove('exit-left', 'exit-right');
    });
    dots.forEach((d, i) => {
      d.dataset.index = String(i);
      d.classList.toggle('active', i === 0);
      d.hidden = i >= worlds.length;
    });

    const THEME = {
      life:     '#020617',
      build:    '#03140a',
      work:     '#000000',
      commerce: '#321200'
    };
    const LIFE_MOVE_MS = 1100;
    const GRASS_MS = 900;
    const SUN_REST_T = 0.62;
    const EDGE_MARGIN = 36;
    const MOVE_MS = 640;

    let linkIndex = -1;
    let startX = 0;
    let deltaX = 0;
    let dragging = false;
    let sunAnim = null;
    let transitioning = false;
    let economyResize = null;

    function setThemeColor(name) {
      const meta = document.getElementById('themeColor');
      if (meta) meta.setAttribute('content', THEME[name] || '#000000');
    }

    function setChroma(on) {
      portalShell.classList.toggle('chroma', on);
    }

    function getActiveLinks() {
      const world = worlds[index];
      if (!world) return [];
      return [...world.querySelectorAll('.links a')];
    }

    const defaultSubtitles = new Map();
    worlds.forEach((w) => {
      const el = w.querySelector('.subtitle');
      if (el) defaultSubtitles.set(w, el.textContent.trim());
    });

    function setActiveSubtitle(text) {
      const world = worlds[index];
      if (!world) return;
      const el = world.querySelector('.subtitle');
      if (el) el.textContent = text;
    }

    function restoreActiveSubtitle() {
      const world = worlds[index];
      if (!world) return;
      const el = world.querySelector('.subtitle');
      if (el) el.textContent = defaultSubtitles.get(world) || el.textContent;
    }

    function clearLinkSelection(opts = {}) {
      document.querySelectorAll('.links a.is-selected').forEach((a) => {
        a.classList.remove('is-selected');
      });
      linkIndex = -1;
      if (opts.restoreSubtitle !== false) restoreActiveSubtitle();
      if (typeof window.__syncJobsPreview === 'function') window.__syncJobsPreview();
    }

    function setLinkSelection(next) {
      const links = getActiveLinks();
      if (!links.length) return;

      clearLinkSelection({ restoreSubtitle: false });
      linkIndex = ((next % links.length) + links.length) % links.length;
      const link = links[linkIndex];
      link.classList.add('is-selected');
      setActiveSubtitle(link.getAttribute('data-subtitle') || link.textContent.trim());

    // Hover on a link updates selection + subtitle (same as keyboard)

        a.addEventListener('mouseenter', () => {

          setLinkSelection(i);
        });
      });
    });

    function sunPoint(t, w, h) {
      const x = -30 + t * (w + 60);
      const y = h * 0.48 - Math.sin(Math.PI * t) * (h * 0.42);
      const scale = 0.72 + Math.sin(Math.PI * t) * 0.38;
      return { x, y, scale };
    }

    function setSun(t, opacity) {
      const w = lifeWorld.clientWidth;
      const h = lifeWorld.clientHeight;
      const p = sunPoint(t, w, h);
      lifeSun.style.opacity = String(opacity);
      lifeSun.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.scale})`;
    }

    function animateSun(fromT, toT, fromOp, toOp, duration) {
      if (sunAnim) cancelAnimationFrame(sunAnim);
      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const u = Math.min(1, (now - start) / duration);
          const e = 1 - Math.pow(1 - u, 3);
          setSun(fromT + (toT - fromT) * e, fromOp + (toOp - fromOp) * e);
          if (u < 1) sunAnim = requestAnimationFrame(frame);
          else { sunAnim = null; resolve(); }
        }
        sunAnim = requestAnimationFrame(frame);
      });
    }

    function growGrass() {
      blades.forEach((blade, i) => {
        const delay = 20 + i * 16;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition = 'none';
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            blade.style.transition =
              `transform ${GRASS_MS}ms cubic-bezier(0.22, 1.25, 0.36, 1) ${delay}ms,` +
              `opacity 260ms ease ${delay}ms`;
            blade.style.opacity = '1';
            blade.style.transform = `scaleY(1) rotate(${tilt}) skewX(${skew})`;
          });
        });
      });
    }

    function retractGrass() {
      blades.forEach((blade, i) => {
        const delay = i * 10;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition =
          `transform 500ms cubic-bezier(0.4, 0, 0.2, 1) ${delay}ms,` +
          `opacity 200ms ease ${delay + 160}ms`;
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
      });
    }

    async function lifeEnter() {
      setSun(0, 0);
      growGrass();
      await animateSun(0, SUN_REST_T, 0, 1, LIFE_MOVE_MS);
    }

    async function lifeExit() {
      retractGrass();
      await animateSun(SUN_REST_T, 1.05, 1, 0, LIFE_MOVE_MS * 0.9);
    }

    function getExitOffset(icon, container) {
      const c = container.getBoundingClientRect();
      const r = icon.getBoundingClientRect();
      const iconCx = r.left + r.width / 2;
      const iconCy = r.top + r.height / 2;
      const cardCx = c.left + c.width / 2;
      const distLeft = iconCx - c.left;
      const distRight = c.right - iconCx;
      const distTop = iconCy - c.top;
      const distBottom = c.bottom - iconCy;
      const nearest = Math.min(distLeft, distRight, distTop, distBottom);
      let dx = 0, dy = 0;
      if (nearest === distLeft) dx = -(distLeft + r.width / 2 + EDGE_MARGIN);
      else if (nearest === distRight) dx = distRight + r.width / 2 + EDGE_MARGIN;
      else if (nearest === distTop) dy = -(distTop + r.height / 2 + EDGE_MARGIN);
      else dy = distBottom + r.height / 2 + EDGE_MARGIN;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = iconCx < cardCx ? -(distLeft + EDGE_MARGIN) : (distRight + EDGE_MARGIN);
      }
      return { dx, dy };
    }

    function setIconTransform(icon, dx, dy, scale, opacity) {
      icon.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      icon.style.opacity = String(opacity);
    }

    function prepareIconsOffCard() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0);
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
        setIconTransform(icon, dx, dy, 0.85, 0);
      });
    }

    function animateIconsIn() {
      buildIcons.forEach((icon, i) => {
        const delay = i * 55;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        icon.style.transition = 'none';
        setIconTransform(icon, x, y, 0.85, 0);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            icon.style.transition =
              `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.2, 0.36, 1) ${delay}ms,` +
              `opacity ${FADE_MS}ms ease ${delay}ms`;
            setIconTransform(icon, 0, 0, 1, 0.9);
          });
        });
      });
    }

    function animateIconsOut() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0.9);
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
      });
      buildIcons.forEach((icon, i) => {
        const delay = i * 30;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        const fadeDelay = delay + Math.max(0, MOVE_MS - FADE_MS - 40);
        icon.style.transition =
          `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.15, 0.36, 1) ${delay}ms,` +
          `opacity ${FADE_MS}ms ease ${fadeDelay}ms`;
        requestAnimationFrame(() => setIconTransform(icon, x, y, 0.85, 0));
      });
    }

    function setAmbient(name) {
      body.classList.remove('portal-life', 'portal-build', 'portal-work', 'portal-commerce');
      body.classList.add(`portal-${name}`);
      portal.classList.remove('life-active', 'build-active', 'work-active', 'commerce-active');
      portal.classList.add(`${name}-active`);

      portalShell.classList.add(`${name}-active`);
      setThemeColor(name);

    function activateWorldEffects(name) {
      if (name === 'life') lifeEnter();

      if (name === 'build') {

        animateIconsIn();
      } else {
        const anyVisible = buildIcons.some((icon) => Number(icon.style.opacity || 0) > 0.05);
        if (anyVisible) animateIconsOut();
        else prepareIconsOffCard();
      }

        requestAnimationFrame(() => {
          requestAnimationFrame(() => economyResize());
        });
      }
    }

    function setPortal(nextIndex, direction = 1) {
      if (transitioning) return;
      nextIndex = (nextIndex + PORTALS.length) % PORTALS.length;
      if (nextIndex === index) return;

      transitioning = true;
      clearLinkSelection();
      setChroma(false);

      const prev = worlds[index];
      const next = worlds[nextIndex];
      const name = PORTALS[nextIndex];

      prev.classList.remove('active');
      prev.classList.add(direction > 0 ? 'exit-left' : 'exit-right'); // optional; opacity 0 either way

      next.classList.remove('exit-left', 'exit-right');
      next.classList.add('active');

      setAmbient(name);
      activateWorldEffects(name);
      if (name !== 'work' && typeof window.__stopJobsPreview === 'function') {
        window.__stopJobsPreview();
      } else if (typeof window.__syncJobsPreview === 'function') {
        window.__syncJobsPreview();
      }

      dots.forEach((d, i) => d.classList.toggle('active', i === nextIndex));
      index = nextIndex;

      setTimeout(() => {
        prev.classList.remove('exit-left', 'exit-right');
        transitioning = false;
      }, 480);
    }

    stage.addEventListener('touchstart', (e) => {
      dragging = true;
      startX = e.touches[0].clientX;
      deltaX = 0;
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      deltaX = e.touches[0].clientX - startX;
    }, { passive: true });

    stage.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(deltaX) > 50) {
        setPortal(index + (deltaX < 0 ? 1 : -1), deltaX < 0 ? 1 : -1);
      }
    });

    portal.addEventListener('pointerdown', () => {
      setChroma(true);
    });

    document.addEventListener('pointerdown', (e) => {
      if (!portalShell.contains(e.target)) {
        setChroma(false);
        clearLinkSelection();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        clearLinkSelection();
        setChroma(false);
        setPortal(index + 1, 1);
        return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        clearLinkSelection();
        setChroma(false);
        setPortal(index - 1, -1);
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const links = getActiveLinks();
        if (!links.length) return;
        setLinkSelection(linkIndex < 0 ? 0 : linkIndex + 1);
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const links = getActiveLinks();
        if (!links.length) return;
        setLinkSelection(linkIndex < 0 ? links.length - 1 : linkIndex - 1);
        return;
      }
      if (e.key === 'Enter') {
        const links = getActiveLinks();
        if (linkIndex >= 0 && links[linkIndex]) {
          e.preventDefault();
          links[linkIndex].click();
        }
      }
    });

    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        const i = Number(dot.dataset.index);
        setPortal(i, i > index ? 1 : -1);
      });
    });

    prepareIconsOffCard();
    setSun(0, 0);
    // Boot from PORTAL_ORDER[0] so ambient, dots, and effects match order
    {
      const startName = PORTALS[0] || 'life';
      setAmbient(startName);
      activateWorldEffects(startName);
      if (startName !== 'work' && typeof window.__stopJobsPreview === 'function') {
        window.__stopJobsPreview();
      } else if (typeof window.__syncJobsPreview === 'function') {
        window.__syncJobsPreview();
      }
    }


    /* ============================================================
       Jobs marketplace – CareerOS / Jobs button
       Square line grid visible; CSS pulse dots hidden.
       Emerging dots grow → pulse at intersections (cell centers).
       Cap 50: fade one out, spawn a new one, indefinitely.
       ============================================================ */
    (function initJobsMarket() {
      const workWorld = document.querySelector('.world.work');
      const canvas = document.getElementById('jobsMarket');
      if (!workWorld || !canvas) return;

      const ctx = canvas.getContext('2d');
      const GRID = 24;
      const MAX_DOTS = 50;
      const EMERGE_INTERVAL = 20;   // frames between new dots while filling (~1.5s at 60fps)
      const TURNOVER_INTERVAL = 120; // frames between fade+spawn once at cap

      let width = 0, height = 0, cols = 0, rows = 0;
      let dots = [];
      let active = false;
      let frame = 0;
      let nextSpawnAt = 20;
      let nextTurnoverAt = 0;
      let raf = 0;

      function resize() {
        const rect = workWorld.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        // line intersections: 0, 24, 48… (inclusive edges that fit)
        cols = Math.max(1, Math.floor(width / GRID));
        rows = Math.max(1, Math.floor(height / GRID));
      }

      function occupied() {
        const s = new Set();
        dots.forEach(d => s.add(d.col + ',' + d.row));
        return s;
      }

      function randomFreeCell() {
        const used = occupied();
        // intersections: col 0..cols, row 0..rows (grid lines)
        for (let tries = 0; tries < 80; tries++) {
          const col = Math.floor(Math.random() * (cols + 1));
          const row = Math.floor(Math.random() * (rows + 1));
          const k = col + ',' + row;
          if (!used.has(k)) {
            return {
              col, row,
              x: col * GRID,
              y: row * GRID
            };
          }
        }
        return null;
      }

      function spawnDot() {
        const cell = randomFreeCell();
        if (!cell) return false;
        dots.push({
          col: cell.col,
          row: cell.row,
          x: cell.x,
          y: cell.y,
          state: 'emerging', // emerging | pulsing | fading
          age: 0,
          pulse: Math.random() * Math.PI * 2,
          scale: 0,
          alpha: 1
        });
        return true;
      }

      function startJobsPreview() {
        if (active) return;
        active = true;
        workWorld.classList.add('jobs-preview');
        resize();
        dots = [];
        frame = 0;
        nextSpawnAt = 20;
        nextTurnoverAt = 0;
        if (!raf) loop();
      }

      function stopJobsPreview() {
        if (!active) return;
        active = false;
        workWorld.classList.remove('jobs-preview');
        dots = [];
        ctx.clearRect(0, 0, width, height);
      }

      function updateDots() {
        for (const d of dots) {
          d.age++;
          if (d.state === 'emerging') {
            // grow then settle (~50 frames)
            if (d.age < 28) {
              d.scale = d.age / 28 * 1.55;
              d.alpha = 1;
            } else if (d.age < 48) {
              d.scale = 1.55 - (d.age - 28) / 20 * 0.55;
              d.alpha = 1;
            } else {
              d.state = 'pulsing';
              d.scale = 1;
              d.pulse = Math.random() * Math.PI * 2;
            }
          } else if (d.state === 'pulsing') {
            d.pulse += 0.022;
            d.scale = 1 + Math.sin(d.pulse) * 0.28;
            d.alpha = 1;
          } else if (d.state === 'fading') {
            d.alpha -= 0.028;
            d.scale *= 0.98;
          }
        }
        dots = dots.filter(d => !(d.state === 'fading' && d.alpha <= 0.02));
      }

      function tickMarket() {
        if (!active) return;
        frame++;

        const live = dots.filter(d => d.state !== 'fading').length;

        if (live < MAX_DOTS) {
          if (frame >= nextSpawnAt) {
            if (spawnDot()) nextSpawnAt = frame + EMERGE_INTERVAL + Math.floor(Math.random() * 40);
            else nextSpawnAt = frame + 30;
          }
        } else {
          // at capacity: fade one, then spawn replacement
          if (nextTurnoverAt === 0) nextTurnoverAt = frame + TURNOVER_INTERVAL;
          if (frame >= nextTurnoverAt) {
            const pulsing = dots.filter(d => d.state === 'pulsing');
            if (pulsing.length) {
              const victim = pulsing[Math.floor(Math.random() * pulsing.length)];
              victim.state = 'fading';
              victim.age = 0;
            }
            // spawn after short beat so fade is visible
            nextSpawnAt = frame + 36;
            nextTurnoverAt = frame + TURNOVER_INTERVAL + Math.floor(Math.random() * 50);
          }
          if (frame >= nextSpawnAt && live < MAX_DOTS + 2) {
            // allow spawn while one is fading so count stays near 30
            const nonFade = dots.filter(d => d.state !== 'fading').length;
            if (nonFade < MAX_DOTS) {
              spawnDot();
              nextSpawnAt = frame + 9999; // wait for next turnover
            }
          }
        }
      }

      function drawDots() {
        ctx.clearRect(0, 0, width, height);
        for (const d of dots) {
          const r = Math.max(1.2, 2.15 * d.scale);
          const a = Math.max(0, Math.min(1, d.alpha));
          ctx.fillStyle = 'rgba(180, 190, 205,' + (0.55 * a) + ')';
          ctx.beginPath();
          ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop() {
        raf = requestAnimationFrame(loop);
        if (!active) return;
        // keep size in sync if card resized
        const rect = workWorld.getBoundingClientRect();
        if (Math.abs(rect.width - width) > 1 || Math.abs(rect.height - height) > 1) resize();
        tickMarket();
        updateDots();
        drawDots();
      }

      function jobsLinkActive() {
        const links = workWorld.querySelectorAll('.links a');
        for (const a of links) {
          if (/jobs/i.test(a.textContent) || /jobs\.briancrink/i.test(a.href || '')) {
            if (a.classList.contains('is-selected') || a.matches(':hover')) return true;
          }
        }
        return false;
      }

      function syncJobsPreview() {
        // Only when CareerOS card is the active world
        const workActive = workWorld.classList.contains('active');
        if (workActive && jobsLinkActive()) startJobsPreview();
        else stopJobsPreview();
      }

      // Hover on Jobs / Career links
      workWorld.querySelectorAll('.links a').forEach((a) => {
        a.addEventListener('mouseenter', () => {
          if (/jobs/i.test(a.textContent)) startJobsPreview();
          else stopJobsPreview();
        });
        a.addEventListener('mouseleave', () => {
          // keep if still keyboard-selected
          requestAnimationFrame(syncJobsPreview);
        });
      });

      // Expose for setLinkSelection / setPortal hooks
      window.__syncJobsPreview = syncJobsPreview;
      window.__stopJobsPreview = stopJobsPreview;

      window.addEventListener('resize', () => {
        if (active) resize();
      });
    })();


    /* ============================================================
       Spherical economic network – Commerce / BossOS
       Nodes & lines: always original warm color
       On select: smooth zoom so network fills the card
       while keeping spherical curvature & rotation
       ============================================================ */
    (function initEconomySphere() {
      const canvas = document.getElementById('economy');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = 0, height = 0;
      let nodes = [];
      let particles = [];
      let rotation = 0;

      const NODE_COUNT = 42;
      const RADIUS = 118;
      const PARTICLE_COUNT = 28;

      // Zoom: normal vs selected
      const SCALE_NORMAL = 1.15;
      const SCALE_ZOOMED = 2.65;
      let currentScale = SCALE_NORMAL;

      function resize() {
        const parent = canvas.parentElement;
        if (!parent) return;

        const rect = parent.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        init();
      }

      economyResize = resize;

      function fibonacciSphere(count, radius) {
        const points = [];
        const phi = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < count; i++) {
          const y = 1 - (i / (count - 1)) * 2;
          const radiusAtY = Math.sqrt(1 - y * y);
          const theta = phi * i;

          const x = Math.cos(theta) * radiusAtY;
          const z = Math.sin(theta) * radiusAtY;

          points.push({
            x: x * radius,
            y: y * radius,
            z: z * radius,
            r: 2.2 + Math.random() * 1.8,
            pulse: Math.random() * Math.PI * 2,
            speed: 0.012 + Math.random() * 0.01
          });
        }
        return points;
      }

      function init() {
        nodes = fibonacciSphere(NODE_COUNT, RADIUS);

        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const from = Math.floor(Math.random() * nodes.length);
          let to = Math.floor(Math.random() * nodes.length);
          while (to === from) to = Math.floor(Math.random() * nodes.length);

          particles.push({
            from,
            to,
            t: Math.random(),
            speed: 0.0018 + Math.random() * 0.0022,
            size: 1.1 + Math.random() * 1.4
          });
        }
      }

      function rotateY(point, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: point.x * cos - point.z * sin,
          y: point.y,
          z: point.x * sin + point.z * cos
        };
      }

      function project(point, scale) {
        const cx = width / 2;
        const cy = height / 2;

        return {
          x: cx + point.x * scale,
          y: cy + point.y * scale,
          z: point.z
        };
      }

      function draw() {
        if (width < 1 || height < 1) {
          requestAnimationFrame(draw);
          return;
        }

        ctx.clearRect(0, 0, width, height);
        rotation += 0.0018;

        const isChroma = portalShell.classList.contains('chroma');
        const targetScale = isChroma ? SCALE_ZOOMED : SCALE_NORMAL;
        // Smooth ease toward target
        currentScale += (targetScale - currentScale) * 0.045;

        // Connection distance threshold scales with zoom so network stays coherent
        const connectDist = 95 * (currentScale / SCALE_NORMAL);

        const projected = nodes.map(n => {
          const rotated = rotateY(n, rotation);
          const p = project(rotated, currentScale);
          return { ...p, r: n.r, pulse: n.pulse, speed: n.speed };
        });

        // Connections — warm orange
        ctx.lineWidth = 1;
        for (let i = 0; i < projected.length; i++) {
          for (let j = i + 1; j < projected.length; j++) {
            const a = projected[i];
            const b = projected[j];

            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dz = nodes[i].z - nodes[j].z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

            if (dist < 95) {
              const avgZ = (a.z + b.z) / 2;
              const alpha = 0.08 + (avgZ / RADIUS) * 0.11;
              if (alpha <= 0) continue;

              ctx.strokeStyle = `rgba(253, 186, 116, ${alpha})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // Nodes — original warm color, no glow
        projected.forEach((p, i) => {
          nodes[i].pulse += nodes[i].speed;
          const scale = 1 + Math.sin(nodes[i].pulse) * 0.22;
          // Slightly larger nodes when zoomed so they remain visible
          const radius = p.r * scale * (0.85 + 0.15 * (currentScale / SCALE_ZOOMED));

          const depth = (p.z / RADIUS + 1) / 2;
          const alpha = 0.35 + depth * 0.6;

          ctx.fillStyle = `rgba(255, 225, 190, ${alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Particles — warm
        particles.forEach(p => {
          p.t += p.speed;
          if (p.t >= 1) {
            p.t = 0;
            p.from = p.to;
            let next = Math.floor(Math.random() * nodes.length);
            while (next === p.from) next = Math.floor(Math.random() * nodes.length);
            p.to = next;
          }

          const a = nodes[p.from];
          const b = nodes[p.to];
          const x3 = a.x + (b.x - a.x) * p.t;
          const y3 = a.y + (b.y - a.y) * p.t;
          const z3 = a.z + (b.z - a.z) * p.t;

          const rotated = rotateY({ x: x3, y: y3, z: z3 }, rotation);
          const proj = project(rotated, currentScale);

          const depth = (proj.z / RADIUS + 1) / 2;
          const alpha = 0.35 + depth * 0.55;

          ctx.fillStyle = `rgba(255, 235, 210, ${alpha})`;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      setTimeout(resize, 50);
      draw();
    })();
  </script>
</body>
</html>
