<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617" id="themeColor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Portal | Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @property --portal-spin {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @property --chroma-hue {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes portalSpin {
      to { --portal-spin: 360deg; }
    }

    @keyframes portalBloomBreathe {
      0%, 100% { filter: blur(14px); opacity: 0.55; }
      50%      { filter: blur(22px); opacity: 0.85; }
    }

    @keyframes portalBloomBreatheSoft {
      0%, 100% { filter: blur(22px); opacity: 0.28; }
      50%      { filter: blur(32px); opacity: 0.48; }
    }

    @keyframes chromaHue {
      to { --chroma-hue: 360deg; }
    }

    .portal-shell {
      position: relative;
      width: 100%;
      --portal-radius: 24px;
      --portal-border: 2px;
      --rim-outset: 3px;
      --bloom-outset: 2px;
      --bloom-soft-outset: 5px;
    }

    .portal-bloom,
    .portal-bloom-soft,
    .portal-rim {
      position: absolute;
      pointer-events: none;
    }

    .portal-bloom {
      inset: calc(-1 * var(--bloom-outset));
      border-radius: calc(var(--portal-radius) + var(--bloom-outset));
      z-index: 0;
      background: conic-gradient(
        from var(--portal-spin),
        var(--bloom-a),
        var(--bloom-b),
        var(--bloom-c),
        var(--bloom-a)
      );
      animation:
        portalSpin 7s linear infinite,
        portalBloomBreathe 4.5s ease-in-out infinite;
    }

    .portal-bloom-soft {
      inset: calc(-1 * var(--bloom-soft-outset));
      border-radius: calc(var(--portal-radius) + var(--bloom-soft-outset));
      z-index: 0;
      background: conic-gradient(
        from var(--portal-spin),
        var(--bloom-a),
        var(--bloom-b),
        var(--bloom-c),
        var(--bloom-a)
      );
      animation:
        portalSpin 11s linear infinite,
        portalBloomBreatheSoft 4.5s ease-in-out infinite;
    }

    .portal-rim {
      inset: calc(-1 * var(--rim-outset));
      border-radius: calc(var(--portal-radius) + var(--rim-outset));
      z-index: 1;
      background: conic-gradient(
        from var(--portal-spin),
        var(--rim-hot) 0%,
        var(--bloom-a) 20%,
        var(--bloom-b) 40%,
        var(--bloom-c) 60%,
        var(--bloom-a) 80%,
        var(--rim-hot) 100%
      );
      animation: portalSpin 5.5s linear infinite;
      padding: var(--rim-outset);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.95;
      box-shadow:
        0 0 8px 1px color-mix(in srgb, var(--bloom-a) 80%, transparent),
        0 0 18px 2px color-mix(in srgb, var(--bloom-b) 45%, transparent);
      transition: box-shadow 0.35s ease;
    }

    .portal-shell.life-active {
      --bloom-a: #38bdf8;
      --bloom-b: #7dd3fc;
      --bloom-c: #e0f2fe;
      --rim-hot: #f0f9ff;
    }
    .portal-shell.build-active {
      --bloom-a: #22c55e;
      --bloom-b: #4ade80;
      --bloom-c: #bbf7d0;
      --rim-hot: #f0fdf4;
    }
    .portal-shell.work-active {
      --bloom-a: #94a3b8;
      --bloom-b: #e2e8f0;
      --bloom-c: #64748b;
      --rim-hot: #f8fafc;
    }
    .portal-shell.commerce-active {
      --bloom-a: #f97316;
      --bloom-b: #fb923c;
      --bloom-c: #fdba74;
      --rim-hot: #fff7ed;
    }

    .portal-shell.chroma .portal-bloom {
      background: conic-gradient(
        from var(--portal-spin),
        #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #ff006e
      );
    }
    .portal-shell.chroma .portal-bloom-soft {
      background: conic-gradient(
        from var(--portal-spin),
        #ff4d6d, #c77dff, #4cc9f0, #80ed99, #ffd60a, #ff4d6d
      );
    }
    .portal-shell.chroma .portal-rim {
      background: conic-gradient(
        from var(--portal-spin),
        #fff, #ff006e, #8338ec, #3a86ff, #06d6a0, #ffbe0b, #fff
      );
      box-shadow:
        0 0 10px 1px rgba(255, 255, 255, 0.7),
        0 0 22px 3px rgba(131, 56, 236, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      .portal-bloom,
      .portal-bloom-soft,
      .portal-rim {
        animation: none;
      }
      .portal-bloom { filter: blur(16px); opacity: 0.65; }
      .portal-bloom-soft { filter: blur(26px); opacity: 0.35; }
      .header,
      .portal-stage,
      .nav-dots {
        animation: none;
        opacity: 1;
      }
    }

    html {
      height: 100%;
      background: #000000;
      transition: background 0.55s ease;
    }

    html:has(body.portal-life)     { background: #020617; }
    html:has(body.portal-build)    { background: #03140a; }
    html:has(body.portal-work)     { background: #000000; }
    html:has(body.portal-commerce) { background: #321200; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px 28px;
      overflow-x: hidden;
      overflow-y: auto;
      background: transparent;
      transition: background 0.55s ease;
      --ground-hot: #7dd3fc;
      --ground-soft: #38bdf8;
      --ground-core: #e0f2fe;
      --ground-wash-opacity: 0.85;
      --ground-reflect-opacity: 0.75;
      --ground-line-opacity: 0.55;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .header,
    .portal-stage,
    .nav-dots {
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    body.portal-life {
      --ground-hot: #7dd3fc;
      --ground-soft: #38bdf8;
      --ground-core: #e0f2fe;
      --ground-wash-opacity: 1.0;
      --ground-reflect-opacity: 1.0;
      --ground-line-opacity: 0.70;
    }
    body.portal-build {
      --ground-hot: #4ade80;
      --ground-soft: #22c55e;
      --ground-core: #bbf7d0;
      --ground-wash-opacity: 1.0;
      --ground-reflect-opacity: 1.0;
      --ground-line-opacity: 0.70;
    }
    body.portal-work {
      --ground-hot: #5a6677;
      --ground-soft: #303d4f;
      --ground-core: #94a3b8;
      --ground-wash-opacity: 0.85;
      --ground-reflect-opacity: 0.8;
      --ground-line-opacity: 0.55;
    }
    body.portal-commerce {
      --ground-hot: #fb923c;
      --ground-soft: #f97316;
      --ground-core: #ffedd5;
      --ground-wash-opacity: 1.0;
      --ground-reflect-opacity: 1.0;
      --ground-line-opacity: 0.70;
    }

    body:has(.portal-shell.chroma) {
      --ground-hot: #ff6b9d;
      --ground-soft: #9b6dff;
      --ground-core: #5aa9ff;
    }

    body:has(.portal-shell.chroma) .scene-ground-wash {
      background: linear-gradient(
        to bottom,
        transparent 0%,
        color-mix(in srgb, #ff6b9d 11%, transparent) 32%,
        color-mix(in srgb, #9b6dff 9%, transparent) 58%,
        color-mix(in srgb, #5aa9ff 7%, transparent) 100%
      );
      opacity: 0.88;
      filter: saturate(1.08) hue-rotate(var(--chroma-hue));
      animation: chromaHue 11s linear infinite;
    }

    body:has(.portal-shell.chroma) .scene-ground-reflect {
      background: radial-gradient(
        ellipse 48% 60% at 50% 100%,
        rgba(255, 107, 157, 0.32) 0%,
        rgba(155, 109, 255, 0.18) 30%,
        rgba(90, 169, 255, 0.12) 52%,
        transparent 78%
      );
      filter: blur(26px) saturate(1.12) hue-rotate(var(--chroma-hue));
      opacity: 0.78;
      animation: chromaHue 11s linear infinite;
    }

    body:has(.portal-shell.chroma) .scene-ground-line {
      background: radial-gradient(
        ellipse 60% 90% at 50% 50%,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 107, 157, 0.14) 28%,
        rgba(155, 109, 255, 0.10) 55%,
        transparent 85%
      );
      filter: blur(14px) saturate(1.08) hue-rotate(var(--chroma-hue));
      opacity: 0.65;
      animation: chromaHue 11s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      body:has(.portal-shell.chroma) .scene-ground-wash,
      body:has(.portal-shell.chroma) .scene-ground-reflect,
      body:has(.portal-shell.chroma) .scene-ground-line {
        animation: none;
      }
    }

    .ambient {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      z-index: 0;
      pointer-events: none;
      transition: background 0.55s ease;
    }

    body.portal-life .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(14, 164, 233, 0.811), transparent 70%),
        #020617;
    }
    body.portal-build .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(22, 163, 74, 0.811), transparent 70%),
        #03140a;
    }
    body.portal-work .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(17, 17, 17, 0.811), transparent 70%),
        #000000;
    }
    body.portal-commerce .ambient {
      background:
        radial-gradient(ellipse 90% 120% at 50% 50%, rgba(255, 89, 0, 0.811), transparent 70%),
        #321200;
    }

    @media (max-width: 768px) {
      body.portal-life .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(14, 164, 233, 0.85) 0%,
            rgba(14, 164, 233, 0.3) 50%,
            #020617 100%
          ),
          #020617;
      }
      body.portal-build .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(22, 163, 74, 0.85) 0%,
            rgba(22, 163, 74, 0.3) 50%,
            #03140a 100%
          ),
          #03140a;
      }
      body.portal-work .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(60, 60, 60, 0.9) 0%,
            rgba(25, 25, 25, 0.5) 50%,
            #000000 100%
          ),
          #000000;
      }
      body.portal-commerce .ambient {
        background:
          radial-gradient(
            ellipse 120% 140% at 50% 40%,
            rgba(255, 89, 0, 0.85) 0%,
            rgba(255, 89, 0, 0.3) 50%,
            #321200 100%
          ),
          #321200;
      }
    }

    .scene-ground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(28vh, 240px);
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%);
    }

    .scene-ground-plane {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.06) 30%,
        rgba(0, 0, 0, 0.28) 65%,
        rgba(0, 0, 0, 0.5) 100%
      );
    }

    .scene-ground-wash {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--ground-soft) 0%, transparent) 0%,
        color-mix(in srgb, var(--ground-soft) 14%, transparent) 45%,
        color-mix(in srgb, var(--ground-soft) 8%, transparent) 100%
      );
      opacity: var(--ground-wash-opacity);
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .scene-ground-reflect {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 120%;
      height: 70%;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse 42% 55% at 50% 100%,
        color-mix(in srgb, var(--ground-hot) 55%, transparent) 0%,
        color-mix(in srgb, var(--ground-soft) 22%, transparent) 40%,
        transparent 72%
      );
      filter: blur(28px);
      opacity: var(--ground-reflect-opacity);
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .scene-ground-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22%;
      height: 48px;
      background: radial-gradient(
        ellipse 55% 80% at 50% 50%,
        color-mix(in srgb, var(--ground-core) 35%, transparent) 0%,
        color-mix(in srgb, var(--ground-hot) 18%, transparent) 40%,
        transparent 75%
      );
      filter: blur(16px);
      opacity: var(--ground-line-opacity);
      transition: background 0.55s ease, opacity 0.55s ease;
    }

    .header,
    .portal-stage,
    .nav-dots {
      position: relative;
      z-index: 1;
    }

    .header {
      padding: 130px 20px 0px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .header {
        padding-top: 80px;
      }
    }

    @media (min-width: 769px) {
      .portal-stage {
        max-width: 440px;
      }
      .portal {
        min-height: 560px;
      }
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover {
      opacity: 0.85;
    }

    .sub-header {
      color: #c3c3c3;
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      padding: 0.3em;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .sub-header-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sub-header-link:hover {
      opacity: 0.85;
    }

    .portal-stage {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      z-index: 1;
      touch-action: pan-y;
      padding-top: 20px;
      padding-bottom: 24px;
    }

    .portal {
      width: 100%;
      border-radius: var(--portal-radius);
      position: relative;
      z-index: 2;
      overflow: hidden;
      min-height: 520px;
      border: var(--portal-border) solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
      transition: border-color 0.45s ease, filter 0.45s ease;
    }

    .portal.life-active {
      border-color: transparent;
      filter: drop-shadow(0 0 4px rgba(14, 165, 233, 0.3))
              drop-shadow(0 0 8px rgba(14, 165, 233, 0.14));
      background:
        linear-gradient(transparent, transparent) padding-box,
        linear-gradient(
          to bottom,
          #fde047 0%,
          #facc15 3%,
          #68d2ff 7%,
          #38bdf8 18%,
          #38bdf8 40%,
          #38bdf8 60%,
          #38bdf8 82%,
          #4ade80 94%,
          #22c55e 97%,
          #16a34a 100%
        ) border-box;
      background-clip: padding-box, border-box;
      background-origin: border-box;
    }

    .portal.build-active {
      border-color: rgba(134, 239, 172, 0.45);
      filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.28))
              drop-shadow(0 0 8px rgba(34, 197, 94, 0.12));
    }

    .portal.work-active {
      border-color: rgba(255, 255, 255, 0.12);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12))
              drop-shadow(0 0 8px rgba(255, 255, 255, 0.06));
    }

    .portal.commerce-active {
      border-color: rgba(253, 186, 116, 0.5);
      filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.28))
              drop-shadow(0 0 8px rgba(249, 115, 22, 0.12));
    }


    .world {
      position: absolute;
      inset: 0;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: none;
      transition: opacity 0.45s ease;
      overflow: hidden;
      border-radius: 0px;
      z-index: 1;
    }

    .world.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* keep classes harmless if JS still toggles them */
    .world.exit-left,
    .world.exit-right {
      opacity: 0;
      transform: none;
    } 

    .world.life {
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .world.life.active {
      border: none;
      background:
        radial-gradient(ellipse 130% 90% at 55% -15%, rgba(250, 204, 21, 0.28), transparent 58%),
        linear-gradient(180deg, #38bdf8 0%, #0ea5e9 45%, #0284c7 100%);
    }

    .life-sun {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      left: 0;
      top: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at 35% 35%, #fff7ae 0%, #fde047 35%, #f59e0b 72%, #d97706 100%);
      box-shadow:
        0 0 18px rgba(250, 204, 21, 0.75),
        0 0 36px rgba(245, 158, 11, 0.45);
      will-change: transform, opacity;
      transform: translate(-30px, 78%) scale(0.7);
    }

    .life-sun::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.35), transparent 70%);
    }

    .life-grass {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -2px;
      height: 64px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: var(--w, 6px);
      height: var(--h, 40px);
      border-radius: 80% 80% 20% 20% / 100% 100% 10% 10%;
      transform-origin: bottom center;
      transform: scaleY(0) rotate(var(--tilt, 0deg)) skewX(var(--skew, 0deg));
      opacity: 0;
      will-change: transform, opacity;
      background: linear-gradient(to top, var(--c1) 0%, var(--c2) 42%, var(--c3) 78%, var(--c4, var(--c3)) 100%);
      filter: saturate(1.08) contrast(1.05);
    }

    .blade.b1  { left: 1%;  --h:28px; --w:5px; --tilt:-10deg; --skew:4deg;  --c1:#14532d; --c2:#166534; --c3:#15803d; --c4:#4ade80; }
    .blade.b2  { left: 5%;  --h:36px; --w:6px; --tilt:8deg;   --skew:-3deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#86efac; }
    .blade.b3  { left: 9%;  --h:30px; --w:5px; --tilt:-6deg;  --skew:2deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#bbf7d0; }
    .blade.b4  { left: 13%; --h:40px; --w:7px; --tilt:11deg;  --skew:-4deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#4ade80; }
    .blade.b5  { left: 17%; --h:26px; --w:5px; --tilt:-9deg;  --skew:3deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#86efac; }
    .blade.b6  { left: 21%; --h:38px; --w:6px; --tilt:5deg;   --skew:-2deg; --c1:#14532d; --c2:#166534; --c3:#16a34a; --c4:#bbf7d0; }
    .blade.b7  { left: 25%; --h:32px; --w:5px; --tilt:-12deg; --skew:5deg;  --c1:#14532d; --c2:#15803d; --c3:#22c55e; --c4:#4ade80; }

    .life-ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 18px;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(to top, rgba(20, 83, 45, 0.55), rgba(22, 101, 52, 0.2) 55%, transparent);
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .world.life.active .life-ground { opacity: 1; }
    .world.life.active .blade { animation: bladeSway 3.6s ease-in-out infinite; }

    @keyframes bladeSway {
      0%, 100% { translate: 0 0; }
      50% { translate: 1.5px 0; }
    }

    .world.build {
      background-color: #15803d;
      background-image:
        linear-gradient(to right, rgba(187, 247, 208, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(187, 247, 208, 0.28) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .build-icons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .build-icon {
      position: absolute;
      font-size: 1.35rem;
      line-height: 1;
      opacity: 0;
      transform: translate(0, 0) scale(0.85);
      will-change: transform, opacity;
    }

    /* mobile size */
    .build-icon img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* desktop size */
    @media (min-width: 769px) {
      .build-icon img {
        width: 44px;
        height: 44px;
      }
    }

    .build-icon.i1 { top: 1%; left: 16%; }
    .build-icon.i2 { top: 4%; right: 3%; }
    .build-icon.i3 { top: 43%; left: 12%; }
    .build-icon.i4 { top: 42%; right: 10%; }
    .build-icon.i5 { bottom: 20%; left: 11%; }
    .build-icon.i6 { bottom: 34%; left: 7%; }
    .build-icon.i7 { top: 22%; right: 8%; }
    .build-icon.i8 { bottom: 18%; right: 13%; }
    .build-icon.i9 { top: 26%; left: 9%; }
    .build-icon.i10 { bottom: 2%; right: 10%; }
    .build-icon.i11 { top: 7%; left: 41%; }
    .build-icon.i12 { bottom: 34%; right: 9%; }
    .build-icon.i13 { top: 5%; right: 26%; }
    .build-icon.i14 { bottom: 4%; left: 6%; }

    .world.work {
      background-color: #000;
      background-image:
        linear-gradient(to right,  rgba(16, 16, 16, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 16, 16, 0.6) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .world.work::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, #161616 2px, transparent 1px);
      background-size: 24px 24px;
      background-position: 12px 12px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: none;
    }

    .world.work.active::before {
      animation: dotPulse 6s ease-in-out infinite;
      opacity: 0.75;
    }

    /* Jobs / Hire marketplace preview: hide CSS pulse dots */
    .world.work.jobs-preview::before,
    .world.work.hire-preview::before {
      animation: none !important;
      opacity: 0 !important;
    }

    /* Hire camera draws the grid on canvas so it pans/zooms with the dots */
    .world.work.hire-preview {
      background-image: none;
    }

    #jobsMarket {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .world.work.jobs-preview #jobsMarket,
    .world.work.hire-preview #jobsMarket {
      opacity: 1;
    }

    .hire-beacon {
      position: absolute;
      width: 15px;
      height: 15px;
      margin: 0;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 3;
      transition: none;
    }
    .hire-beacon.is-on {
      opacity: 1;
      visibility: visible;
    }
    .hire-beacon .hire-dot {
      width: 15px;
      height: 15px;
      background: #27c93f;
      border-radius: 50%;
      box-shadow: 0 0 10px #27c93f;
      position: relative;
      z-index: 3;
      display: block;
    }
    .hire-beacon .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      background: #18b02f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.45;
      animation: pulseBeacon 1.35s infinite ease-out;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes pulseBeacon {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2.3); opacity: 0; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0; }
      50%      { opacity: 0.95; }
    }

    .world.commerce {
      background: #ea580c;
    }

    #economy {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.9;
      pointer-events: none;
    }

    .category {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .world h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .world.life h2 { color: #b5e8ffbc; }
    .world.build h2 { color: #b0ffcdd0; }
    .world.work h2 { color: #0cff04c5; }
    .world.commerce h2 { color: #ffdbb5c2; }

    .os-mark {
      font-weight: 600;
      color: rgba(254, 254, 254, 0.377);
    }

    .portal-shell.chroma .os-mark {
      color: #ffffff;
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    body:has(.portal-shell.chroma) .sub-header-link {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      body:has(.portal-shell.chroma) .sub-header-link {
        animation: none;
      }
    }


    .sub-header-cluster {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover {
      opacity: 0.85;
    }

    .map-icon {
      width: 2.8rem;
      height: 2.8rem;
      display: block;
    }

    .sub-header {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-link {
      position: absolute;
      left: 100%;
      top: 50%;
      margin-left: 0rem;
      transform: translateY(-50%);
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 35px;
      position: relative;
      z-index: 1;
    }

    .world.work .category,
    .world.work .subtitle,
    .world.work .hire-location {
      color: #8b949e;
    }

    .hire-lede {
      position: relative;
      margin-bottom: 35px;
    }

    .world.work .hire-lede .subtitle {
      margin-bottom: 0;
    }

    .hire-location {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      font-size: 0.95rem;
      text-align: left;
      position: absolute;
      left: 0;
      top: calc(100% + 4px);
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: none;
    }

    .hire-location.is-on {
      opacity: 1;
      transition: opacity 1.4s ease;
    }

    .hire-location .hire-pin {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: block;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .links a {
      display: block;
      width: 40%;
      max-width: 40%;
      box-sizing: border-box;
      text-decoration: none;
      text-align: center;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .world.work .links a {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .world.work .links a:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .links a:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.28);
    }

    .links a.is-selected {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      outline: none;
    }

    .world.work .links a.is-selected {
      background: rgba(30, 254, 18, 0.06);
      border-color: #29eb463b;
    }

    body.portal-life .links a.is-selected {
      background: rgba(149, 221, 255, 0.442);
      border-color: rgba(125, 211, 252, 0.55);
    }
    body.portal-build .links a.is-selected {
      background: rgba(0, 255, 157, 0.18);
      border-color: rgba(0, 255, 157, 0.45);
    }
    body.portal-commerce .links a.is-selected {
      background: rgba(255, 185, 127, 0.379);
      border-color: rgba(251, 146, 60, 0.5);
    }

    .nav-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 8px 0;
      position: relative;
      z-index: 2;
    }

    .nav-dot {
      position: relative;
      width: 22px;
      height: 22px;
      background: transparent;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .nav-dot.active {
      transform: scale(1.12);
    }

    .nav-dot .nav-hole {
      position: absolute;
      left: 50%;
      top: calc(22px * 21.35 / 24);
      width: calc(22px * 14.6 / 24);
      height: calc(22px * 4.5 / 24);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      transition: background 0.25s ease;
      background: rgba(255, 255, 255, 0.2);
    }

    body.portal-life .nav-dot .nav-hole {
      background: rgba(125, 211, 252, 0.2);
    }
    body.portal-build .nav-dot .nav-hole {
      background: rgba(0, 255, 157, 0.2);
    }
    body.portal-work .nav-dot .nav-hole {
      background: rgba(255, 255, 255, 0.2);
    }
    body.portal-commerce .nav-dot .nav-hole {
      background: rgba(251, 146, 60, 0.2);
    }

    body.portal-life .nav-dot.active .nav-hole {
      background: #7dd3fc;
    }
    body.portal-build .nav-dot.active .nav-hole {
      background: #00ff9d;
    }
    body.portal-work .nav-dot.active .nav-hole {
      background: #ffffff;
    }
    body.portal-commerce .nav-dot.active .nav-hole {
      background: #fb923c;
    }

    body:has(.portal-shell.chroma) .nav-dot.active .nav-hole {
      background: conic-gradient(
        from var(--portal-spin),
        #ff006e,
        #8338ec,
        #3a86ff,
        #06d6a0,
        #ffbe0b,
        #ff006e
      );
      animation: portalSpin 7s linear infinite;
    }

    .nav-dot svg {
      position: absolute;
      inset: 0;
      width: 22px;

  <script>
    const body = document.body;
    const portal = document.getElementById('portal');
    const portalShell = document.getElementById('portalShell');
    const stage = document.getElementById('stage');
    const dots = [...document.querySelectorAll('.nav-dot')];
    const lifeSun = document.getElementById('lifeSun');
    const lifeWorld = document.querySelector('.world.life');
    const buildWorld = document.getElementById('buildWorld');
    const blades = [...document.querySelectorAll('.blade')];
    const buildIcons = [...document.querySelectorAll('.build-icon')];

    /* ============================================================
       PORTAL ORDER — change only this array to reorder OS views.
       Keys: 'life' (LifeOS), 'build' (DevOS), 'work' (CareerOS),
             'commerce' (BossOS)
       Example BossOS first:
         const PORTAL_ORDER = ['commerce', 'life', 'build', 'work'];
       ============================================================ */
    const PORTAL_ORDER = ['life', 'commerce', 'build', 'work'];

    const worldByName = Object.fromEntries(
      [...document.querySelectorAll('.world')].map((w) => [w.dataset.portal, w])
    );
    // Ordered list driven only by PORTAL_ORDER (not HTML section order)
    const worlds = PORTAL_ORDER.map((name) => {
      const w = worldByName[name];
      if (!w) console.warn('[portal] missing world for', name);
      return w;
    }).filter(Boolean);
    const PORTALS = worlds.map((w) => w.dataset.portal);

    // Sync data-index, category labels, and active class to PORTAL_ORDER
    const HASH_TO_PORTAL = {
      life: 'life',
      dev: 'build',
      career: 'work',
      boss: 'commerce'
    };
    const PORTAL_TO_HASH = {
      life: 'life',
      build: 'dev',
      work: 'career',
      commerce: 'boss'
    };

    function portalIndexFromHash(hash) {
      const key = String(hash || '').replace(/^#/, '').trim().toLowerCase();
      const name = HASH_TO_PORTAL[key];
      if (!name) return -1;
      return PORTALS.indexOf(name);
    }

    function hashFromPortal(name) {
      return PORTAL_TO_HASH[name] || name;
    }

    function syncPortalHash(name) {
      const next = '#' + hashFromPortal(name);
      if (location.hash === next) return;
      try {
        history.replaceState(null, '', next);
      } catch (err) {
        try { location.hash = next; } catch (e2) { /* preview / opaque origin */ }
      }
    }

    const bootIndex = (() => {
      const fromHash = portalIndexFromHash(location.hash);
      return fromHash >= 0 ? fromHash : 0;
    })();

    worlds.forEach((w, i) => {
      w.dataset.index = String(i);
      const cat = w.querySelector('.category');
      if (cat) cat.textContent = String(i + 1).padStart(2, '0');
      w.classList.toggle('active', i === bootIndex);
      w.classList.remove('exit-left', 'exit-right');
    });
    dots.forEach((d, i) => {
      d.dataset.index = String(i);
      if (PORTALS[i]) d.dataset.portal = PORTALS[i];
      d.classList.toggle('active', i === bootIndex);
      d.hidden = i >= worlds.length;
    });

    const THEME = {
      life:     '#020617',
      build:    '#03140a',
      work:     '#000000',
      commerce: '#321200'
    };
    const LIFE_MOVE_MS = 1100;
    const GRASS_MS = 900;
    const SUN_REST_T = 0.62;
    const EDGE_MARGIN = 36;
    const MOVE_MS = 640;
    const FADE_MS = 200;

    let index = bootIndex;
    let linkIndex = -1;
    let startX = 0;
    let deltaX = 0;
    let dragging = false;
    let sunAnim = null;
    let transitioning = false;
    let economyResize = null;

    function setThemeColor(name) {
      const meta = document.getElementById('themeColor');
      if (meta) meta.setAttribute('content', THEME[name] || '#000000');
    }

    function setChroma(on) {
      portalShell.classList.toggle('chroma', on);
    }

    function getActiveLinks() {
      const world = worlds[index];
      if (!world) return [];
      return [...world.querySelectorAll('.links a')];
    }

    const defaultSubtitles = new Map();
    worlds.forEach((w) => {
      const el = w.querySelector('.subtitle');
      if (el) defaultSubtitles.set(w, el.textContent.trim());
    });

    function setActiveSubtitle(text) {
      const world = worlds[index];
      if (!world) return;
      const el = world.querySelector('.subtitle');
      if (el) el.textContent = text;
    }

    function restoreActiveSubtitle() {
      const world = worlds[index];
      if (!world) return;
      const el = world.querySelector('.subtitle');
      if (el) el.textContent = defaultSubtitles.get(world) || el.textContent;
    }

    function clearLinkSelection(opts = {}) {
      document.querySelectorAll('.links a.is-selected').forEach((a) => {
        a.classList.remove('is-selected');
      });
      linkIndex = -1;
      if (opts.restoreSubtitle !== false) restoreActiveSubtitle();
      // Skip sync while swapping links — an empty selection would wipe Jobs dots
      // before Hire can pick one. Click-outside still syncs (default).
      if (opts.syncJobs !== false && typeof window.__syncJobsPreview === 'function') {
        window.__syncJobsPreview();
      }
    }

    function setLinkSelection(next) {
      const links = getActiveLinks();
      if (!links.length) return;

      clearLinkSelection({ restoreSubtitle: false, syncJobs: false });
      linkIndex = ((next % links.length) + links.length) % links.length;
      const link = links[linkIndex];
      link.classList.add('is-selected');
      setActiveSubtitle(link.getAttribute('data-subtitle') || link.textContent.trim());
      setChroma(true);
      if (typeof window.__syncJobsPreview === 'function') window.__syncJobsPreview();
    }

    // Hover on a link updates selection + subtitle (same as keyboard)
    worlds.forEach((world) => {
      world.querySelectorAll('.links a').forEach((a, i) => {
        a.addEventListener('mouseenter', () => {
          if (worlds[index] !== world) return;
          setLinkSelection(i);
        });
      });
    });

    function sunPoint(t, w, h) {
      const x = -30 + t * (w + 60);
      const y = h * 0.48 - Math.sin(Math.PI * t) * (h * 0.42);
      const scale = 0.72 + Math.sin(Math.PI * t) * 0.38;
      return { x, y, scale };
    }

    function setSun(t, opacity) {
      const w = lifeWorld.clientWidth;
      const h = lifeWorld.clientHeight;
      const p = sunPoint(t, w, h);
      lifeSun.style.opacity = String(opacity);
      lifeSun.style.transform = `translate(${p.x}px, ${p.y}px) scale(${p.scale})`;
    }

    function animateSun(fromT, toT, fromOp, toOp, duration) {
      if (sunAnim) cancelAnimationFrame(sunAnim);
      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const u = Math.min(1, (now - start) / duration);
          const e = 1 - Math.pow(1 - u, 3);
          setSun(fromT + (toT - fromT) * e, fromOp + (toOp - fromOp) * e);
          if (u < 1) sunAnim = requestAnimationFrame(frame);
          else { sunAnim = null; resolve(); }
        }
        sunAnim = requestAnimationFrame(frame);
      });
    }

    function growGrass() {
      blades.forEach((blade, i) => {
        const delay = 20 + i * 16;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition = 'none';
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            blade.style.transition =
              `transform ${GRASS_MS}ms cubic-bezier(0.22, 1.25, 0.36, 1) ${delay}ms,` +
              `opacity 260ms ease ${delay}ms`;
            blade.style.opacity = '1';
            blade.style.transform = `scaleY(1) rotate(${tilt}) skewX(${skew})`;
          });
        });
      });
    }

    function retractGrass() {
      blades.forEach((blade, i) => {
        const delay = i * 10;
        const tilt = getComputedStyle(blade).getPropertyValue('--tilt') || '0deg';
        const skew = getComputedStyle(blade).getPropertyValue('--skew') || '0deg';
        blade.style.transition =
          `transform 500ms cubic-bezier(0.4, 0, 0.2, 1) ${delay}ms,` +
          `opacity 200ms ease ${delay + 160}ms`;
        blade.style.opacity = '0';
        blade.style.transform = `scaleY(0) rotate(${tilt}) skewX(${skew})`;
      });
    }

    async function lifeEnter() {
      setSun(0, 0);
      growGrass();
      await animateSun(0, SUN_REST_T, 0, 1, LIFE_MOVE_MS);
    }

    async function lifeExit() {
      retractGrass();
      await animateSun(SUN_REST_T, 1.05, 1, 0, LIFE_MOVE_MS * 0.9);
    }

    function getExitOffset(icon, container) {
      const c = container.getBoundingClientRect();
      const r = icon.getBoundingClientRect();
      const iconCx = r.left + r.width / 2;
      const iconCy = r.top + r.height / 2;
      const cardCx = c.left + c.width / 2;
      const distLeft = iconCx - c.left;
      const distRight = c.right - iconCx;
      const distTop = iconCy - c.top;
      const distBottom = c.bottom - iconCy;
      const nearest = Math.min(distLeft, distRight, distTop, distBottom);
      let dx = 0, dy = 0;
      if (nearest === distLeft) dx = -(distLeft + r.width / 2 + EDGE_MARGIN);
      else if (nearest === distRight) dx = distRight + r.width / 2 + EDGE_MARGIN;
      else if (nearest === distTop) dy = -(distTop + r.height / 2 + EDGE_MARGIN);
      else dy = distBottom + r.height / 2 + EDGE_MARGIN;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = iconCx < cardCx ? -(distLeft + EDGE_MARGIN) : (distRight + EDGE_MARGIN);
      }
      return { dx, dy };
    }

    // Alternating rest tilts (scattered on the board)
    const ICON_REST_ROT = [-8, 7, -5, 9, -7, 6, -9, 8, -4, 10, -6, 7, -8, 5];

    buildIcons.forEach((icon, i) => {
      icon.dataset.restRot = String(ICON_REST_ROT[i % ICON_REST_ROT.length]);
    });

    function iconRestRot(icon) {
      return Number(icon.dataset.restRot || 0);
    }

    // Start opposite the rest tilt so the icon swivels into place
    function iconTravelRot(icon) {
      const rest = iconRestRot(icon);
      // ~28–36° away, opposite sign → clear twist during the move
      return rest >= 0 ? -(36 + Math.abs(rest)) : (36 + Math.abs(rest));
    }

    function setIconTransform(icon, dx, dy, scale, opacity, rot) {
      const r = rot != null ? rot : iconRestRot(icon);
      // rotate between translate and scale so the twist reads clearly
      icon.style.transform =
        `translate(${dx}px, ${dy}px) rotate(${r}deg) scale(${scale})`;
      icon.style.opacity = String(opacity);
    }

    function prepareIconsOffCard() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0, iconTravelRot(icon));
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
        setIconTransform(icon, dx, dy, 0.85, 0, iconTravelRot(icon));
      });
    }

    function animateIconsIn() {
      buildIcons.forEach((icon, i) => {
        const delay = i * 55;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        icon.style.transition = 'none';
        setIconTransform(icon, x, y, 0.85, 0, iconTravelRot(icon));
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            icon.style.transition =
              `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.2, 0.36, 1) ${delay}ms,` +
              `opacity ${FADE_MS}ms ease ${delay}ms`;
            // Settle at rest tilt
            setIconTransform(icon, 0, 0, 1, 0.9, iconRestRot(icon));
          });
        });
      });
    }

    function animateIconsOut() {
      buildIcons.forEach((icon) => {
        icon.style.transition = 'none';
        setIconTransform(icon, 0, 0, 1, 0.9, iconRestRot(icon));
      });
      void buildWorld.offsetWidth;
      buildIcons.forEach((icon) => {
        const { dx, dy } = getExitOffset(icon, buildWorld);
        icon.dataset.exitX = dx;
        icon.dataset.exitY = dy;
      });
      buildIcons.forEach((icon, i) => {
        const delay = i * 30;
        const x = Number(icon.dataset.exitX || 0);
        const y = Number(icon.dataset.exitY || 0);
        const fadeDelay = delay + Math.max(0, MOVE_MS - FADE_MS - 40);
        icon.style.transition =
          `transform ${MOVE_MS}ms cubic-bezier(0.22, 1.15, 0.36, 1) ${delay}ms,` +
          `opacity ${FADE_MS}ms ease ${fadeDelay}ms`;
        requestAnimationFrame(() =>
          setIconTransform(icon, x, y, 0.85, 0, iconTravelRot(icon))
        );
      });
    }

    function setAmbient(name) {
      body.classList.remove('portal-life', 'portal-build', 'portal-work', 'portal-commerce');
      body.classList.add(`portal-${name}`);
      portal.classList.remove('life-active', 'build-active', 'work-active', 'commerce-active');
      portal.classList.add(`${name}-active`);
      portalShell.classList.remove('life-active', 'build-active', 'work-active', 'commerce-active');
      portalShell.classList.add(`${name}-active`);
      setThemeColor(name);
    }

    function activateWorldEffects(name) {
      if (name === 'life') lifeEnter();
      else {
        if (Number(lifeSun.style.opacity || 0) > 0.05) lifeExit();
        else { setSun(0, 0); retractGrass(); }
      }

      if (name === 'build') {
        if (!buildIcons[0].dataset.exitX) prepareIconsOffCard();
        animateIconsIn();
      } else {
        const anyVisible = buildIcons.some((icon) => Number(icon.style.opacity || 0) > 0.05);
        if (anyVisible) animateIconsOut();
        else prepareIconsOffCard();
      }

      if (name === 'commerce' && typeof economyResize === 'function') {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => economyResize());
        });
      }
    }

    function setPortal(nextIndex, direction = 1) {
      if (transitioning) return;
      nextIndex = (nextIndex + PORTALS.length) % PORTALS.length;
      if (nextIndex === index) return;

      transitioning = true;
      clearLinkSelection();
      setChroma(false);

      const prev = worlds[index];
      const next = worlds[nextIndex];
      const name = PORTALS[nextIndex];

      prev.classList.remove('active');
      prev.classList.add(direction > 0 ? 'exit-left' : 'exit-right'); // optional; opacity 0 either way

      next.classList.remove('exit-left', 'exit-right');
      next.classList.add('active');

      setAmbient(name);
      activateWorldEffects(name);
      if (name !== 'work' && typeof window.__stopJobsPreview === 'function') {
        window.__stopJobsPreview();
      } else if (typeof window.__syncJobsPreview === 'function') {
        window.__syncJobsPreview();
      }

      dots.forEach((d, i) => d.classList.toggle('active', i === nextIndex));
      index = nextIndex;
      syncPortalHash(name);

      setTimeout(() => {
        prev.classList.remove('exit-left', 'exit-right');
        transitioning = false;
      }, 480);
    }

    function applyHashPortal() {
      const nextIndex = portalIndexFromHash(location.hash);
      if (nextIndex < 0 || nextIndex === index) return;
      setPortal(nextIndex, nextIndex > index ? 1 : -1);
    }

    window.addEventListener('hashchange', applyHashPortal);

    stage.addEventListener('touchstart', (e) => {
      dragging = true;
      startX = e.touches[0].clientX;
      deltaX = 0;
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      deltaX = e.touches[0].clientX - startX;
    }, { passive: true });

    stage.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(deltaX) > 50) {
        setPortal(index + (deltaX < 0 ? 1 : -1), deltaX < 0 ? 1 : -1);
      }
    });

    portal.addEventListener('pointerdown', () => {
      setChroma(true);
    });

    document.addEventListener('pointerdown', (e) => {
      if (!portalShell.contains(e.target)) {
        setChroma(false);
        clearLinkSelection();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        clearLinkSelection();
        setChroma(false);
        setPortal(index + 1, 1);
        return;
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        clearLinkSelection();
        setChroma(false);
        setPortal(index - 1, -1);
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const links = getActiveLinks();
        if (!links.length) return;
        setLinkSelection(linkIndex < 0 ? 0 : linkIndex + 1);
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const links = getActiveLinks();
        if (!links.length) return;
        setLinkSelection(linkIndex < 0 ? links.length - 1 : linkIndex - 1);
        return;
      }
      if (e.key === 'Enter') {
        const links = getActiveLinks();
        if (linkIndex >= 0 && links[linkIndex]) {
          e.preventDefault();
          links[linkIndex].click();
        }
      }
    });

    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        const i = Number(dot.dataset.index);
        setPortal(i, i > index ? 1 : -1);
      });
    });

    prepareIconsOffCard();
    setSun(0, 0);
    // Boot from hash (#life #dev #career #boss) or PORTAL_ORDER[0]
    {
      const startName = PORTALS[index] || PORTALS[0] || 'life';
      setAmbient(startName);
      activateWorldEffects(startName);
      syncPortalHash(startName);
      if (startName !== 'work' && typeof window.__stopJobsPreview === 'function') {
        window.__stopJobsPreview();
      } else if (typeof window.__syncJobsPreview === 'function') {
        window.__syncJobsPreview();
      }
    }


    /* ============================================================
       Jobs marketplace + Hire focus – CareerOS
       Jobs: emerging dots at grid intersections.
       Hire: pick a pulsing job, pan grid+dots so it sits at the
       safe intersection (4th row from top, 4th column from right),
       fade other dots, then zoom in. Camera moves — dots stay
       locked to intersections.
       ============================================================ */
    (function initJobsMarket() {
      const workWorld = document.querySelector('.world.work');
      const canvas = document.getElementById('jobsMarket');
      if (!workWorld || !canvas) return;

      const ctx = canvas.getContext('2d');
      const GRID = 24;
      const MAX_DOTS = 50;
      const EMERGE_INTERVAL = 20;
      const TURNOVER_INTERVAL = 120;
      const HIRE_SCALE = 2.2;
      const HIRE_BEAT = 20;          // pause after slide / emerge before zoom
      const HIRE_PAN_LEAD = 22;      // beat so the chosen job is visible first
      const HIRE_PAN_FRAMES = 170;   // ease-in-out slide
      const HIRE_ZOOM_FRAMES = 84;   // ~1.4s ease-in-out zoom

      let width = 0, height = 0, cols = 0, rows = 0;
      let dots = [];
      let active = false;
      let mode = 'off'; // off | jobs | hire
      let frame = 0;
      let nextSpawnAt = 20;
      let nextTurnoverAt = 0;
      let raf = 0;

      let camX = 0, camY = 0, camScale = 1;
      let targetCamX = 0, targetCamY = 0, targetScale = 1;
      let hirePhase = 'idle'; // idle | lead | emerge | pan | rest | zoom | hold
      let hireWait = 0;
      let hireTween = 0;
      let fromCamX = 0, fromCamY = 0, fromScale = 1;
      let chosen = null;

      function resize() {
        const rect = workWorld.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        cols = Math.max(1, Math.floor(width / GRID));
        rows = Math.max(1, Math.floor(height / GRID));
        if (mode === 'hire' && chosen) applyHireCameraTargets();
      }

      let hireBay = null;

      function hireBayScreen() {
        if (hireBay) return hireBay;
        const wr = workWorld.getBoundingClientRect();
        const sub = workWorld.querySelector('.subtitle');
        const DOT = 15, GAP = 10;
        if (!sub) {
          hireBay = { x: Math.max(24, width * 0.62), y: Math.max(36, height * 0.16) };
          return hireBay;
        }
        let box = sub.getBoundingClientRect();
        try {
          const range = document.createRange();
          range.selectNodeContents(sub);
          const rects = range.getClientRects();
          if (rects.length) box = rects[rects.length - 1];
        } catch (e) {}
        hireBay = {
          x: box.right - wr.left + GAP + DOT / 2,
          y: box.top - wr.top + box.height / 2
        };
        return hireBay;
      }

      function placeHireBeacon(bay) {
        const el = workWorld.querySelector('.hire-beacon');
        if (!el || !bay) return;
        el.style.left = bay.x + 'px';
        el.style.top = bay.y + 'px';
      }

      function setHireBeacon(on) {
        const el = workWorld.querySelector('.hire-beacon');
        if (el) el.classList.toggle('is-on', !!on);
      }

      function setHireLocation(on) {
        const el = workWorld.querySelector('.hire-location');
        if (!el) return;
        if (on) {
          el.removeAttribute('aria-hidden');
          el.classList.add('is-on');
        } else {
          el.classList.remove('is-on');
          el.setAttribute('aria-hidden', 'true');
        }
      }

      function safeIntersection() {
        const bay = hireBayScreen();
        return {
          col: Math.max(0, Math.min(cols, Math.round(bay.x / GRID))),
          row: Math.max(0, Math.min(rows, Math.round(bay.y / GRID)))
        };
      }

      function occupied() {
        const s = new Set();
        dots.forEach(d => s.add(d.col + ',' + d.row));
        return s;
      }

      function randomFreeCell() {
        const used = occupied();
        for (let tries = 0; tries < 80; tries++) {
          const col = Math.floor(Math.random() * (cols + 1));
          const row = Math.floor(Math.random() * (rows + 1));
          const k = col + ',' + row;
          if (!used.has(k)) return { col, row };
        }
        return null;
      }

      function spawnDot(cell, state) {
        const at = cell || randomFreeCell();
        if (!at) return null;
        const d = {
          col: at.col,
          row: at.row,
          state: state || 'emerging',
          age: 0,
          pulse: Math.random() * Math.PI * 2,
          scale: state === 'pulsing' ? 1 : 0,
          alpha: 1
        };
        dots.push(d);
        return d;
      }

      function worldToScreen(col, row) {
        return {
          x: camX + col * GRID * camScale,
          y: camY + row * GRID * camScale
        };
      }

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function beaconCenter() {
        const el = workWorld.querySelector('.hire-beacon');
        const wr = workWorld.getBoundingClientRect();
        if (el) {
          const r = el.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            return {
              x: r.left + r.width / 2 - wr.left,
              y: r.top + r.height / 2 - wr.top
            };
          }
        }
        return hireBayScreen();
      }

      function applyHireCameraTargets() {
        if (!chosen) return;
        const seat = beaconCenter();
        const useScale = (hirePhase === 'zoom' || hirePhase === 'hold') ? HIRE_SCALE : 1;
        targetScale = useScale;
        targetCamX = seat.x - chosen.col * GRID * targetScale;
        targetCamY = seat.y - chosen.row * GRID * targetScale;
      }

      function resetCamera() {
        camX = 0; camY = 0; camScale = 1;
        targetCamX = 0; targetCamY = 0; targetScale = 1;
        hirePhase = 'idle';
        hireWait = 0;
        hireTween = 0;
        fromCamX = 0; fromCamY = 0; fromScale = 1;
        chosen = null;
        hireBay = null;
        setHireBeacon(false);
        setHireLocation(false);
      }

      function startJobsPreview() {
        if (mode === 'jobs') return;
        workWorld.classList.add('jobs-preview');
        workWorld.classList.remove('hire-preview');
        resize();
        dots = [];
        frame = 0;
        nextSpawnAt = 20;
        nextTurnoverAt = 0;
        if (!raf) loop();
        active = true;
        mode = 'jobs';
        resetCamera();
      }

      function startHirePreview() {
        if (mode === 'hire') return;
        workWorld.classList.add('hire-preview');
        workWorld.classList.remove('jobs-preview');
        resize();
        if (!active) {
          dots = [];
          frame = 0;
          if (!raf) loop();
        }
        active = true;
        mode = 'hire';

        hireBay = null;
        const bayPt = hireBayScreen();
        placeHireBeacon(bayPt);
        setHireBeacon(false);

        const live = dots.filter(d => d.state === 'pulsing' || d.state === 'emerging');
        const spawned = live.length === 0;
        const safe = safeIntersection();
        if (live.length) {
          const ranked = live
            .map(d => ({ d, dist: Math.abs(d.col - safe.col) + Math.abs(d.row - safe.row) }))
            .sort((a, b) => a.dist - b.dist);
          const nearestAway = ranked.find(x => x.dist > 0);
          chosen = (nearestAway || ranked[0]).d;
        } else {
          chosen = spawnDot({
            col: Math.max(0, safe.col - 6),
            row: Math.max(0, Math.min(rows, safe.row + 2))
          }, 'emerging');
        }
        if (!chosen) return;

        if (!spawned && chosen.state === 'emerging') {
          // keep emerging; do not snap to pulsing
        } else if (!spawned) {
          chosen.state = 'pulsing';
          chosen.alpha = 1;
        }

        dots.forEach(d => {
          if (d !== chosen && d.state !== 'fading') {
            d.state = 'fading';
            d.age = 0;
          }
        });

        camX = 0;
        camY = 0;
        camScale = 1;
        targetScale = 1;
        hireWait = 0;
        if (spawned) {
          hirePhase = 'emerge';
          applyHireCameraTargets();
        } else {
          hirePhase = 'lead';
          applyHireCameraTargets();
        }
      }

      function stopJobsPreview() {
        if (!active && mode === 'off') return;
        active = false;
        mode = 'off';
        workWorld.classList.remove('jobs-preview');
        workWorld.classList.remove('hire-preview');
        dots = [];
        resetCamera();
        ctx.clearRect(0, 0, width, height);
      }

      function updateDots() {
        for (const d of dots) {
          d.age++;
          if (d.state === 'emerging') {
            if (d.age < 28) {
              d.scale = d.age / 28 * 1.55;
              d.alpha = Math.min(1, d.age / 18);
            } else if (d.age < 48) {
              d.scale = 1.55 - (d.age - 28) / 20 * 0.55;
              d.alpha = 1;
            } else {
              d.state = 'pulsing';
              d.scale = 1;
              d.pulse = Math.random() * Math.PI * 2;
            }
          } else if (d.state === 'pulsing') {
            d.pulse += 0.022;
            d.scale = 1 + Math.sin(d.pulse) * 0.28;
            if (d.canvasFade) d.alpha = Math.max(0, d.alpha - 0.018);
            else d.alpha = 1;
          } else if (d.state === 'fading') {
            d.alpha -= (mode === 'hire' ? 0.016 : 0.028);
            d.scale *= 0.98;
          }
        }
        dots = dots.filter(d => !(d.state === 'fading' && d.alpha <= 0.02));
        if (chosen && !dots.includes(chosen)) chosen = null;
      }

      function tickMarket() {
        if (!active || mode !== 'jobs') return;
        frame++;
        const live = dots.filter(d => d.state !== 'fading').length;
        if (live < MAX_DOTS) {
          if (frame >= nextSpawnAt) {
            if (spawnDot()) nextSpawnAt = frame + EMERGE_INTERVAL + Math.floor(Math.random() * 40);
            else nextSpawnAt = frame + 30;
          }
        } else {
          if (nextTurnoverAt === 0) nextTurnoverAt = frame + TURNOVER_INTERVAL;
          if (frame >= nextTurnoverAt) {
            const pulsing = dots.filter(d => d.state === 'pulsing');
            if (pulsing.length) {
              const victim = pulsing[Math.floor(Math.random() * pulsing.length)];
              victim.state = 'fading';
              victim.age = 0;
            }
            nextSpawnAt = frame + 36;
            nextTurnoverAt = frame + TURNOVER_INTERVAL + Math.floor(Math.random() * 50);
          }
          if (frame >= nextSpawnAt && live < MAX_DOTS + 2) {
            const nonFade = dots.filter(d => d.state !== 'fading').length;
            if (nonFade < MAX_DOTS) {
              spawnDot();
              nextSpawnAt = frame + 9999;
            }
          }
        }
      }

      function beginHireHandoff() {
        setHireBeacon(true);
        if (chosen) chosen.canvasFade = true;
      }

      function tickHireCamera() {
        if (mode !== 'hire') return;
        hireWait++;

        if (hirePhase === 'emerge') {
          if (chosen && chosen.state === 'pulsing' && hireWait > 8) {
            hireWait = 0;
            hirePhase = 'lead';
          }
          return;
        }

        if (hirePhase === 'lead') {
          if (hireWait >= HIRE_PAN_LEAD) {
            hireWait = 0;
            hireTween = 0;
            fromCamX = camX;
            fromCamY = camY;
            fromScale = camScale;
            hirePhase = 'pan';
            applyHireCameraTargets();
          }
          return;
        }

        if (hirePhase === 'rest') {
          beginHireHandoff();
          if (hireWait >= HIRE_BEAT) {
            hireWait = 0;
            hireTween = 0;
            fromCamX = camX;
            fromCamY = camY;
            fromScale = camScale;
            hirePhase = 'zoom';
            applyHireCameraTargets();
            setHireLocation(true);
          }
          return;
        }

        if (hirePhase === 'pan' || hirePhase === 'zoom') {
          const dur = hirePhase === 'pan' ? HIRE_PAN_FRAMES : HIRE_ZOOM_FRAMES;
          hireTween = Math.min(1, hireTween + 1 / dur);
          const k = easeInOutCubic(hireTween);
          camX = fromCamX + (targetCamX - fromCamX) * k;
          camY = fromCamY + (targetCamY - fromCamY) * k;
          camScale = fromScale + (targetScale - fromScale) * k;
          if (hireTween >= 1) {
            camX = targetCamX;
            camY = targetCamY;
            camScale = targetScale;
            if (hirePhase === 'pan') {
              hireWait = 0;
              hirePhase = 'rest';
            } else {
              hirePhase = 'hold';
            }
          }
        }
      }

      function drawGrid() {
        ctx.lineWidth = 1;
        const cell = GRID * camScale;
        const minCol = Math.floor((-camX) / cell) - 1;
        const maxCol = Math.ceil((width - camX) / cell) + 1;
        const minRow = Math.floor((-camY) / cell) - 1;
        const maxRow = Math.ceil((height - camY) / cell) + 1;

        ctx.strokeStyle = 'rgba(16, 16, 16, 0.85)';
        for (let c = minCol; c <= maxCol; c++) {
          const x = camX + c * cell;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let r = minRow; r <= maxRow; r++) {
          const y = camY + r * cell;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        const zoomT = Math.max(0, Math.min(1, (camScale - 1) / (HIRE_SCALE - 1)));
        const fineAlpha = 0.85 * zoomT * zoomT;
        if (fineAlpha <= 0.02) return;

        const half = cell / 2;
        const minFc = Math.floor((-camX) / half) - 1;
        const maxFc = Math.ceil((width - camX) / half) + 1;
        const minFr = Math.floor((-camY) / half) - 1;
        const maxFr = Math.ceil((height - camY) / half) + 1;
        ctx.strokeStyle = 'rgba(16, 16, 16,' + fineAlpha + ')';
        for (let c = minFc; c <= maxFc; c++) {
          if (c % 2 === 0) continue;
          const x = camX + c * half;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let r = minFr; r <= maxFr; r++) {
          if (r % 2 === 0) continue;
          const y = camY + r * half;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      }

      function drawDots() {
        for (const d of dots) {
          const p = worldToScreen(d.col, d.row);
          const r = Math.max(1.2, 2.15 * d.scale * (0.9 + 0.1 * camScale));
          const a = Math.max(0, Math.min(1, d.alpha));
          const fill = d === chosen && mode === 'hire'
            ? 'rgba(230, 235, 245,' + (0.85 * a) + ')'
            : 'rgba(180, 190, 205,' + (0.55 * a) + ')';
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function loop() {
        raf = requestAnimationFrame(loop);
        if (!active) return;
        const rect = workWorld.getBoundingClientRect();
        if (Math.abs(rect.width - width) > 1 || Math.abs(rect.height - height) > 1) resize();
        tickMarket();
        tickHireCamera();
        updateDots();
        ctx.clearRect(0, 0, width, height);
        if (mode === 'hire') drawGrid();
        drawDots();
      }

      function jobsLinkActive() {
        const links = workWorld.querySelectorAll('.links a');
        for (const a of links) {
          if (/jobs/i.test(a.textContent) || /jobs\.briancrink/i.test(a.href || '')) {
            if (a.classList.contains('is-selected') || a.matches(':hover')) return true;
          }
        }
        return false;
      }

      function hireLinkActive() {
        const links = workWorld.querySelectorAll('.links a');
        for (const a of links) {
          if (/^hire$/i.test(a.textContent.trim()) || /hire\.briancrink/i.test(a.href || '')) {
            if (a.classList.contains('is-selected') || a.matches(':hover')) return true;
          }
        }
        return false;
      }

      function syncJobsPreview() {
        const workActive = workWorld.classList.contains('active');
        if (!workActive) {
          stopJobsPreview();
          return;
        }
        if (hireLinkActive()) startHirePreview();
        else if (jobsLinkActive()) startJobsPreview();
        else stopJobsPreview();
      }

      workWorld.querySelectorAll('.links a').forEach((a) => {
        a.addEventListener('mouseenter', () => {
          const label = (a.textContent || '').trim();
          if (/^hire$/i.test(label) || /hire\.briancrink/i.test(a.href || '')) startHirePreview();
          else if (/jobs/i.test(label)) startJobsPreview();
          else stopJobsPreview();
        });
        a.addEventListener('mouseleave', () => {
          requestAnimationFrame(syncJobsPreview);
        });
      });

      window.__syncJobsPreview = syncJobsPreview;
      window.__stopJobsPreview = stopJobsPreview;

      window.addEventListener('resize', () => {
        if (active) resize();
      });
    })();


    /* ============================================================
       Spherical economic network – Commerce / BossOS
       Nodes & lines: always original warm color
       On select: smooth zoom so network fills the card
       while keeping spherical curvature & rotation
       ============================================================ */
    (function initEconomySphere() {
      const canvas = document.getElementById('economy');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = 0, height = 0;
      let nodes = [];
      let particles = [];
      let rotation = 0;

      const NODE_COUNT = 42;
      const RADIUS = 118;
      const PARTICLE_COUNT = 28;

      // Zoom: normal vs selected
      const SCALE_NORMAL = 1.15;
      const SCALE_ZOOMED = 2.65;
      let currentScale = SCALE_NORMAL;

      function resize() {
        const parent = canvas.parentElement;
        if (!parent) return;

        const rect = parent.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';

        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        init();
      }

      economyResize = resize;

      function fibonacciSphere(count, radius) {
        const points = [];
        const phi = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < count; i++) {
          const y = 1 - (i / (count - 1)) * 2;
          const radiusAtY = Math.sqrt(1 - y * y);
          const theta = phi * i;

          const x = Math.cos(theta) * radiusAtY;
          const z = Math.sin(theta) * radiusAtY;

          points.push({
            x: x * radius,
            y: y * radius,
            z: z * radius,
            r: 2.2 + Math.random() * 1.8,
            pulse: Math.random() * Math.PI * 2,
            speed: 0.012 + Math.random() * 0.01
          });
        }
        return points;
      }

      function init() {
        nodes = fibonacciSphere(NODE_COUNT, RADIUS);

        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const from = Math.floor(Math.random() * nodes.length);
          let to = Math.floor(Math.random() * nodes.length);
          while (to === from) to = Math.floor(Math.random() * nodes.length);

          particles.push({
            from,
            to,
            t: Math.random(),
            speed: 0.0018 + Math.random() * 0.0022,
            size: 1.1 + Math.random() * 1.4
          });
        }
      }

      function rotateY(point, angle) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
          x: point.x * cos - point.z * sin,
          y: point.y,
          z: point.x * sin + point.z * cos
        };
      }

      function project(point, scale) {
        const cx = width / 2;
        const cy = height / 2;

        return {
          x: cx + point.x * scale,
          y: cy + point.y * scale,
          z: point.z
        };
      }

      function draw() {
        if (width < 1 || height < 1) {
          requestAnimationFrame(draw);
          return;
        }

        ctx.clearRect(0, 0, width, height);
        rotation += 0.0018;

        const isChroma = portalShell.classList.contains('chroma');
        const targetScale = isChroma ? SCALE_ZOOMED : SCALE_NORMAL;
        // Smooth ease toward target
        currentScale += (targetScale - currentScale) * 0.045;

        // Connection distance threshold scales with zoom so network stays coherent
        const connectDist = 95 * (currentScale / SCALE_NORMAL);

        const projected = nodes.map(n => {
          const rotated = rotateY(n, rotation);
          const p = project(rotated, currentScale);
          return { ...p, r: n.r, pulse: n.pulse, speed: n.speed };
        });

        // Connections — warm orange
        ctx.lineWidth = 1;
        for (let i = 0; i < projected.length; i++) {
          for (let j = i + 1; j < projected.length; j++) {
            const a = projected[i];
            const b = projected[j];

            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dz = nodes[i].z - nodes[j].z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

            if (dist < 95) {
              const avgZ = (a.z + b.z) / 2;
              const alpha = 0.08 + (avgZ / RADIUS) * 0.11;
              if (alpha <= 0) continue;

              ctx.strokeStyle = `rgba(253, 186, 116, ${alpha})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // Nodes — original warm color, no glow
        projected.forEach((p, i) => {
          nodes[i].pulse += nodes[i].speed;
          const scale = 1 + Math.sin(nodes[i].pulse) * 0.22;
          // Slightly larger nodes when zoomed so they remain visible
          const radius = p.r * scale * (0.85 + 0.15 * (currentScale / SCALE_ZOOMED));

          const depth = (p.z / RADIUS + 1) / 2;
          const alpha = 0.35 + depth * 0.6;

          ctx.fillStyle = `rgba(255, 225, 190, ${alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Particles — warm
        particles.forEach(p => {
          p.t += p.speed;
          if (p.t >= 1) {
            p.t = 0;
            p.from = p.to;
            let next = Math.floor(Math.random() * nodes.length);
            while (next === p.from) next = Math.floor(Math.random() * nodes.length);
            p.to = next;
          }

          const a = nodes[p.from];
          const b = nodes[p.to];
          const x3 = a.x + (b.x - a.x) * p.t;
          const y3 = a.y + (b.y - a.y) * p.t;
          const z3 = a.z + (b.z - a.z) * p.t;

          const rotated = rotateY({ x: x3, y: y3, z: z3 }, rotation);
          const proj = project(rotated, currentScale);

          const depth = (proj.z / RADIUS + 1) / 2;
          const alpha = 0.35 + depth * 0.55;

          ctx.fillStyle = `rgba(255, 235, 210, ${alpha})`;
          ctx.beginPath();
          ctx.arc(proj.x, proj.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      setTimeout(resize, 50);
      draw();
    })();
  </script>
